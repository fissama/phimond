[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script src=\"../shared/hud/hud.js\"></script><script>(()=>{const f=window.fetch.bind(window);window.fetch=(u,o)=>{const s=String(u&&u.url||u).split(\"?\")[0];if(s.endsWith(\"index.pck\"))return f(new URL(\"index-pck.wasm\",location.href),o);if(!s.endsWith(\"index.wasm\"))return f(u,o);return (async()=>{const m=await (await f(new URL(\"wasm-parts.json\",location.href))).json();const bufs=await Promise.all(m.parts.map(p=>f(new URL(p,location.href)).then(r=>r.arrayBuffer())));const b=new Blob(bufs,{type:\"application/wasm\"});return new Response(b,{headers:{\"content-type\":\"application/wasm\",\"content-length\":String(b.size)}});})();};})();</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
