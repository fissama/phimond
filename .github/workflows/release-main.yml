name: release-main

# Push vào main: kiểm tra -> tính version -> build/push 2 image lên Harbor -> gắn tag -> bump tag image trong philandz/infra.
# ArgoCD (Application "phimond") tự rollout từ repo infra.
on:
  push:
    branches: [main]
    # Thay đổi chỉ về tài liệu/manifest/art nguồn không phát hành lại (server 1 bản sao: mỗi lần rollout ngắt người chơi).
    paths-ignore:
      - '**.md'
      - '.ai/**'
      - 'docs/**'
      - 'deploy/homelab/**'
      - '.github/workflows/**'
      - 'apps/web/**'
      - 'apps/game-web/**'
      - 'apps/game-client/**'
  workflow_dispatch: {}

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write

env:
  REGISTRY_PROJECT: phimond
  INFRA_REPO: fissama/phimond-infra

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Repo có art nguồn rất nặng (.git ~5,8 GB): chỉ lấy các thư mục cần cho build/test.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            apps/game-server
            apps/client
            packages
            data
            migrations
            deploy
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/game-server/go.mod
          cache-dependency-path: apps/game-server/go.sum
      - name: Go test
        working-directory: apps/game-server
        run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - name: Client typecheck + unit test
        working-directory: apps/client
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            apps/game-server
            apps/client
            packages
            data
            migrations
            deploy

      - name: Validate commit message
        run: |
          SUBJECT="$(git log -1 --format=%s)"
          echo "Head commit: $SUBJECT"
          if ! echo "$SUBJECT" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|chore|ci|build|deploy|art)(\([a-z0-9._/-]+\))?!?: .+'; then
            echo "::error::Commit phải theo '<type>(<scope>): <subject>' (feat|fix|docs|style|refactor|perf|test|chore|ci|build|deploy|art)."
            exit 1
          fi

      - name: Compute version
        id: ver
        run: |
          LAST="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"
          if [ -z "$LAST" ]; then
            NEXT="v1.0.0"
          else
            MAJ="$(echo "$LAST" | sed -E 's/^v([0-9]+)\..*/\1/')"
            MIN="$(echo "$LAST" | sed -E 's/^v[0-9]+\.([0-9]+)\..*/\1/')"
            PAT="$(echo "$LAST" | sed -E 's/^v[0-9]+\.[0-9]+\.([0-9]+)$/\1/')"
            SUBJECTS="$(git log "$LAST"..HEAD --format=%s)"
            BODIES="$(git log "$LAST"..HEAD --format=%b)"
            if echo "$SUBJECTS" | grep -Eq '^[a-z]+(\([^)]*\))?!:' || echo "$BODIES" | grep -q 'BREAKING CHANGE'; then
              NEXT="v$((MAJ+1)).0.0"
            elif echo "$SUBJECTS" | grep -Eq '^feat(\(|:|!)'; then
              NEXT="v${MAJ}.$((MIN+1)).0"
            else
              NEXT="v${MAJ}.${MIN}.$((PAT+1))"
            fi
          fi
          echo "Last: ${LAST:-none} -> Next: $NEXT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Login Harbor
        run: echo "${{ secrets.HARBOR_PASS }}" | docker login "${{ secrets.HARBOR_HOST }}" -u "${{ secrets.HARBOR_USER }}" --password-stdin

      - name: Build and push images
        env:
          DOCKER_BUILDKIT: '1'
          VERSION: ${{ steps.ver.outputs.version }}
          HARBOR_HOST: ${{ secrets.HARBOR_HOST }}
        run: |
          SERVER="$HARBOR_HOST/$REGISTRY_PROJECT/phimond-server:$VERSION"
          WEB="$HARBOR_HOST/$REGISTRY_PROJECT/phimond-web:$VERSION"
          docker build -f apps/game-server/Dockerfile -t "$SERVER" .
          docker build -f deploy/web/Dockerfile -t "$WEB" .
          docker push "$SERVER"
          docker push "$WEB"

      - name: Tag release
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "phimond-release-bot"
          git config user.email "phimond-release-bot@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Bump image tags in infra repo
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          HARBOR_HOST: ${{ secrets.HARBOR_HOST }}
          INFRA_DEPLOY_KEY: ${{ secrets.INFRA_DEPLOY_KEY }}
          INFRA_KNOWN_HOSTS: ${{ secrets.INFRA_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$INFRA_DEPLOY_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$INFRA_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          git clone "git@github.com:${INFRA_REPO}.git" infra
          cd infra
          git config user.name "phimond-release-bot"
          git config user.email "phimond-release-bot@users.noreply.github.com"
          HOST_RE="$(echo "$HARBOR_HOST" | sed 's/\./\\./g')"
          bump() {
            sed -i -E "s#(image: ${HOST_RE}/${REGISTRY_PROJECT}/$1:)v[0-9]+\.[0-9]+\.[0-9]+#\1${VERSION}#" "$2"
            grep -q ":${VERSION}" "$2" || { echo "::error::Không thấy image $1 trong $2"; exit 1; }
          }
          bump phimond-server deploy/phimond/server-deployment.yaml
          bump phimond-server deploy/phimond/jobs/migrate-job.yaml
          bump phimond-web deploy/phimond/web-deployment.yaml
          git add deploy/phimond
          git commit -m "chore(deploy): update phimond to ${VERSION}"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push thất bại, thử rebase lần $i"
            git pull --rebase origin main
          done
          echo "::error::Không push được lên infra main"
          exit 1
