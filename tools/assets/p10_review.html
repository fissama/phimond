<!doctype html>
<html lang="vi">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phimond · Review roster hiệu lực</title>
<style>
:root{color-scheme:dark;--bg:#111923;--panel:#1b2735;--line:#34455b;--text:#e8edf5;--muted:#a8b8c9;--gold:#ffd783;--green:#87d9b4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui}button,input,select,textarea{font:inherit}button,select,input{border:1px solid var(--line);background:#243449;color:var(--text);border-radius:8px;padding:9px}button{cursor:pointer}button:hover{border-color:var(--gold)}button:disabled{opacity:.45;cursor:default}header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:22px;margin:0 0 5px}h2{font-size:25px;margin:0}p{margin:6px 0}.muted{color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);height:calc(100vh - 88px)}aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.filters{padding:14px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.filters select,.filters input{min-width:0;width:100%;box-sizing:border-box}.filters input,.filters #sort,.filters #reviewFilter,.filters #provenanceFilter{grid-column:1/-1}.list{overflow:auto;padding:0 10px 12px}.pet{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:8px;margin:4px 0;background:transparent}.pet.selected{background:#314057;border-color:var(--gold)}.pet canvas{width:48px;height:52px;flex-shrink:0;image-rendering:pixelated}.pet strong{font-size:14px}.pet small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.dot{margin-left:auto;color:var(--muted)}.dot.ok{color:var(--green)}.dot.fix{color:#ffad91}main{overflow:auto;padding:22px;min-width:0}.title{display:flex;justify-content:space-between;align-items:center;gap:12px}.badge{color:var(--gold);font-size:14px;margin-top:6px}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:18px 0 12px}.toolbar label{display:flex;gap:6px;align-items:center}.stage{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:14px}.preview,.original{border:1px solid var(--line);border-radius:12px;background:#323e4b;text-align:center;overflow:hidden}.preview.light,.original.light{background:#ece5d3}.preview canvas{width:100%;max-width:480px;height:auto;image-rendering:pixelated;display:block;margin:auto}.original img{width:160px;height:160px;object-fit:contain;image-rendering:pixelated;margin:14px auto}.original p{color:#d4dce5;padding:10px;background:#243449;margin:0}.frames{display:flex;gap:8px;justify-content:center;padding:10px}.frames button.active{border-color:var(--gold);background:#3c4754}.review{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:16px}.approve{font-size:17px;display:flex;align-items:center;gap:10px}.approve input{accent-color:var(--green);width:20px;height:20px}.review textarea{display:block;width:100%;min-height:112px;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#111e2c;color:var(--text);resize:vertical}.savebar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}#saved{color:var(--green);font-size:13px}.error{color:#ffad91!important}.notice{font-size:13px;color:#ffcf93;margin:10px 0}.footer{margin:12px 0;overflow-wrap:anywhere}.empty{padding:20px;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:270px minmax(0,1fr)}.stage{grid-template-columns:1fr}.original{display:none}main{padding:14px}}@media(max-width:650px){header{padding:14px}.layout{height:auto;display:block}aside{height:340px;border-bottom:1px solid var(--line)}main{overflow:visible}.title{align-items:flex-start}h2{font-size:21px}}
</style>
<header><div><h1>Phimond · Review roster hiệu lực</h1><p class="muted">Xem từng hoạt ảnh, duyệt bản vẽ và ghi phần cần sửa.</p></div><div><p id="summary">Đang tải…</p><button id="export">Xuất nhận xét</button></div></header>
<div class="layout"><aside><div class="filters"><input id="search" aria-label="Tìm loài" placeholder="Tìm tên hoặc ID…"><select id="sort" aria-label="Sắp xếp"><option value="star_desc">Sao: cao → thấp</option><option value="star_asc">Sao: thấp → cao</option><option value="race">Hệ, rồi tên</option><option value="name">Tên: A → Z</option><option value="name_desc">Tên: Z → A</option></select><select id="star" aria-label="Lọc sao"><option value="">Mọi số sao</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><select id="race" aria-label="Lọc hệ"><option value="">Mọi hệ</option></select><select id="reviewFilter" aria-label="Lọc duyệt"><option value="">Mọi trạng thái duyệt</option><option value="pending">Chưa duyệt</option><option value="revised">Bản sửa mới · chờ duyệt</option><option value="approved">Đã duyệt</option><option value="fix">Có nhận xét cần sửa</option></select><select id="provenanceFilter" aria-label="Lọc nguồn thiết kế"><option value="">Mọi nguồn thiết kế</option><option value="authored">8 loài Phimond-authored mới</option><option value="frozen">152 loài đã duyệt</option></select><div id="count" class="muted"></div></div><div id="list" class="list"></div></aside>
<main id="main"><div class="title"><div><h2 id="name">Đang tải…</h2><div id="badge" class="badge"></div></div><div><button id="prevPet">← Trước</button> <button id="nextPet">Tiếp →</button></div></div><div id="notice" class="notice"></div>
<div class="toolbar"><select id="animation" aria-label="Hoạt ảnh"><option value="0">Idle · Đứng</option><option value="1">Move · Di chuyển</option><option value="2">Đánh thường</option><option value="3">Cast skill · Dùng kỹ năng</option><option value="4">Die · Gục/ngã</option></select><button id="play">Dừng</button><button id="replay">Xem lại</button><label><input id="loop" type="checkbox" checked>Lặp idle / move</label><select id="size" aria-label="Kích thước"><option value="large">Xem lớn</option><option value="game">Size thử trong game</option><option value="64">64 px</option><option value="96">96 px</option><option value="192">192 px</option></select><button id="theme">Nền sáng</button><button id="retryImage">Tải lại ảnh</button></div>
<div class="stage"><div id="preview" class="preview"><canvas id="canvas" width="480" height="330"></canvas><div id="frames" class="frames"></div></div><div id="original" class="original"><p id="sourceLabel">Sprite APK gốc</p><p id="authoredInfo" hidden>Thiết kế Phimond-authored · không có sprite APK/JAR gốc.</p><img id="source" alt="Sprite gốc của loài đang chọn"></div></div>
<section class="review"><label class="approve"><input id="approved" type="checkbox">Duyệt bản vẽ này</label><label for="comment"><p class="muted">Nhận xét / phần cần sửa</p></label><textarea id="comment" maxlength="10000" placeholder="Ví dụ: Move chưa đổi chân; khuôn mặt chưa đúng; Cast cần rõ hơn…"></textarea><div class="savebar"><span id="saved">Nhận xét được lưu trong workspace.</span><button id="save">Lưu nhận xét</button></div></section><p id="version" class="muted footer"></p><p class="muted">Duyệt được ghi cho đúng bản đang xem. Bản vẽ mới sẽ cần duyệt lại.</p></main></div>
<script>
const $=id=>document.getElementById(id), collator=new Intl.Collator('vi',{numeric:true}), animNames=['idle','move','basic_attack','cast_skill','die'];
let species=[],reviews={},selected=null,visible=[],images=new Map(),start=performance.now(),playing=true,manualFrame=null,dark=true,timer=null,observer;const saveQueues=new Map();
const fold=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
function currentReview(e){return reviews[e.id]?.[e.sha256]||{approved:e.previously_approved,comment:''}}
function state(e){const r=currentReview(e);return r.approved?'approved':r.comment.trim()?'fix':'pending'}
function img(e){if(!e.atlas)return null;if(!images.has(e.id)){const im=new Image();let retries=0;im.onerror=()=>{if(retries<2){retries++;im.src=e.atlas+'?v='+e.sha256+'&retry='+retries}else if(selected?.id===e.id){$('notice').textContent='Không tải được atlas. Bấm Tải lại ảnh để thử lại.'}};im.src=e.atlas;images.set(e.id,im)}return images.get(e.id)}
function summary(){const n=species.filter(e=>state(e)==='approved').length,f=species.filter(e=>state(e)==='fix').length;$('summary').textContent=`${n}/${species.length} đã duyệt · ${f} có nhận xét`}
function drawThumb(canvas,e){if(!e.atlas)return;const image=img(e),draw=()=>{const b=e.bounds[0],ctx=canvas.getContext('2d');ctx.clearRect(0,0,48,52);ctx.imageSmoothingEnabled=false;const scale=Math.min(44/(b[2]-b[0]),48/(b[3]-b[1]));ctx.drawImage(image,b[0],b[1],b[2]-b[0],b[3]-b[1],(48-(b[2]-b[0])*scale)/2,(52-(b[3]-b[1])*scale)/2,(b[2]-b[0])*scale,(b[3]-b[1])*scale)};if(image.complete&&image.naturalWidth)draw();else image.addEventListener('load',draw,{once:true})}
function renderList(){const query=fold($('search').value);visible=species.filter(e=>(!query||fold(e.name+' '+e.id).includes(query))&&(!$('star').value||e.star===Number($('star').value))&&(!$('race').value||e.race===$('race').value)&&(!$('provenanceFilter').value||($('provenanceFilter').value==='authored'?e.provenance==='Phimond-authored':e.provenance!=='Phimond-authored'))&&(!$('reviewFilter').value||($('reviewFilter').value==='revised'?!!e.revision_note&&!currentReview(e).approved:state(e)===$('reviewFilter').value)));visible.sort((a,b)=>{const sort=$('sort').value;if(sort==='star_desc')return b.star-a.star||collator.compare(a.name,b.name);if(sort==='star_asc')return a.star-b.star||collator.compare(a.name,b.name);if(sort==='race')return collator.compare(a.race_name,b.race_name)||collator.compare(a.name,b.name);return collator.compare(a.name,b.name)*(sort==='name_desc'?-1:1)});observer?.disconnect();observer=new IntersectionObserver(items=>{for(const item of items)if(item.isIntersecting){const e=species.find(e=>e.id===item.target.dataset.id);drawThumb(item.target,e);observer.unobserve(item.target)}},{root:$('list'),rootMargin:'100px'});$('list').replaceChildren();for(const e of visible){const button=document.createElement('button');button.className='pet'+(e.id===selected?.id?' selected':'');button.dataset.id=e.id;const c=document.createElement('canvas');c.width=48;c.height=52;c.dataset.id=e.id;const text=document.createElement('span'),name=document.createElement('strong'),meta=document.createElement('small'),dot=document.createElement('span');name.textContent=e.name;meta.textContent=`${'★'.repeat(e.star)} · ${e.race_name}${e.special?' · Special':''}`;text.append(name,meta);dot.className='dot '+(state(e)==='approved'?'ok':state(e)==='fix'?'fix':'');dot.textContent=state(e)==='approved'?'✓':state(e)==='fix'?'!':'○';button.append(c,text,dot);button.onclick=()=>selectPet(e);$('list').append(button);observer.observe(c)}if(!visible.length){const p=document.createElement('p');p.className='empty';p.textContent='Không có loài khớp bộ lọc.';$('list').append(p)}$('count').textContent=`${visible.length}/${species.length} loài`;updateNav();summary()}
function updateNav(){const i=visible.findIndex(e=>e.id===selected?.id);$('prevPet').disabled=i<=0;$('nextPet').disabled=i<0||i===visible.length-1}
function selectPet(e){if(selected&&timer){clearTimeout(timer);timer=null;persist(remember())}selected=e;location.hash=e.id;$('name').textContent=e.name;$('badge').textContent=`${'★'.repeat(e.star)} · ${e.race_name}${e.special?' · Special':''}`;$('source').hidden=!e.original;$('authoredInfo').hidden=!!e.original;$('sourceLabel').textContent=e.original?'Sprite APK gốc':'Phimond-authored';if(e.original)$('source').src=e.original;else $('source').removeAttribute('src');for(const id of ['approved','comment','save','retryImage'])$(id).disabled=!e.atlas;const r=currentReview(e);$('approved').checked=r.approved;$('comment').value=r.comment;$('saved').className='';$('saved').textContent=r.updated_at?'Đã lưu nhận xét.':'Nhận xét được lưu trong workspace.';$('version').textContent=`${e.id} · ${e.version} · ${e.provenance} · ${e.sha256||'Chưa có hash atlas'}`;$('notice').textContent=!e.atlas?'Đang chuẩn bị atlas. Chưa thể duyệt.':e.provenance==='Phimond-authored'?(r.approved?'Bạn đã ghi duyệt bản thiết kế này · chưa chọn art hoặc kích hoạt runtime.':'Bản thiết kế mới · chờ bạn duyệt đúng hash; chưa được chọn art hoặc kích hoạt runtime.'):r.approved?'Bạn đã duyệt · Chốt bản vẽ này.':e.revision_note?'Bản sửa mới · '+e.revision_note:e.audit==='fail'?'Bản này còn điểm cần sửa ở hoạt ảnh — bạn có thể ghi nhận xét bên dưới.':e.draft?'Bản thử đang được chỉnh sửa.':'';if(e.provenance==='Phimond-authored'&&e.revision_note)$('notice').textContent+=' Nhận xét hình ảnh: '+e.revision_note;start=performance.now();manualFrame=null;playing=true;$('play').textContent='Dừng';img(e);renderList();renderFrames()}
function renderFrames(){const f=$('frames');f.replaceChildren();for(let i=0;i<4;i++){const button=document.createElement('button');button.textContent='Frame '+(i+1);button.dataset.frame=i;button.onclick=()=>{manualFrame=i;playing=false;$('play').textContent='Chạy'};f.append(button)}}
function remember(){if(!selected?.atlas)return null;const e=selected,r={species_id:e.id,sha256:e.sha256,approved:$('approved').checked,comment:$('comment').value,animation:animNames[Number($('animation').value)]};reviews[e.id]??={};reviews[e.id][e.sha256]={...currentReview(e),...r};summary();return r}
function persist(record){if(!record)return;const key=record.species_id+record.sha256,task=(saveQueues.get(key)||Promise.resolve()).then(()=>sendReview(record));saveQueues.set(key,task);return task}
async function sendReview(record){try{const response=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(record),keepalive:true}),body=await response.json();if(!response.ok)throw new Error(body.error||'Không lưu được');const local=reviews[record.species_id][record.sha256],latest=local.comment===record.comment&&local.approved===record.approved;if(latest)reviews[record.species_id][record.sha256]=body.review;if(latest&&selected?.id===record.species_id&&selected.sha256===record.sha256){$('saved').className='';$('saved').textContent='Đã lưu ✓'}renderList()}catch(err){if(selected?.id===record.species_id){$('saved').className='error';$('saved').textContent='Chưa lưu: '+err.message}}}
function schedule(){clearTimeout(timer);const record=remember();$('saved').className='';$('saved').textContent='Đang lưu…';timer=setTimeout(()=>{timer=null;persist(record)},500)}
$('comment').addEventListener('input',schedule);$('approved').onchange=()=>{clearTimeout(timer);timer=null;persist(remember());renderList()};$('save').onclick=()=>{clearTimeout(timer);timer=null;persist(remember())};for(const id of ['search','sort','star','race','reviewFilter','provenanceFilter'])$(id).addEventListener(id==='search'?'input':'change',renderList);
$('prevPet').onclick=()=>{const i=visible.findIndex(e=>e.id===selected.id);if(i>0)selectPet(visible[i-1])};$('nextPet').onclick=()=>{const i=visible.findIndex(e=>e.id===selected.id);if(i<visible.length-1)selectPet(visible[i+1])};
$('animation').onchange=()=>{$('loop').checked=Number($('animation').value)<2;$('loop').disabled=Number($('animation').value)>=2;start=performance.now();manualFrame=null;playing=true;$('play').textContent='Dừng'};$('play').onclick=()=>{playing=!playing;if(playing){manualFrame=null;start=performance.now()}$('play').textContent=playing?'Dừng':'Chạy'};$('replay').onclick=()=>{playing=true;manualFrame=null;start=performance.now();$('play').textContent='Dừng'};$('theme').onclick=()=>{dark=!dark;$('preview').classList.toggle('light',!dark);$('original').classList.toggle('light',!dark);$('theme').textContent=dark?'Nền sáng':'Nền tối'};
$('export').onclick=async()=>{try{if(timer){clearTimeout(timer);timer=null;persist(remember())}await Promise.all(saveQueues.values());const response=await fetch('/api/reviews');if(!response.ok)throw new Error('Không tải được nhận xét');const data=await response.json(),blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='phimond-owner-reviews.json';link.click();URL.revokeObjectURL(url)}catch(e){$('saved').className='error';$('saved').textContent=e.message}};
$('retryImage').onclick=()=>{if(selected?.atlas){images.delete(selected.id);img(selected);$('notice').textContent='Đang tải lại ảnh…';images.get(selected.id).addEventListener('load',()=>{$('notice').textContent='Đã tải lại atlas.'},{once:true})}};
window.addEventListener('pagehide',()=>{if(timer){clearTimeout(timer);timer=null;persist(remember())}});
let lastFrame=0;function tick(t){const ctx=$('canvas').getContext('2d');ctx.clearRect(0,0,480,330);if(selected){const e=selected,image=img(e),row=Number($('animation').value),duration=[150,150,170,220,260][row],elapsed=t-start;let frame=manualFrame??lastFrame;if(playing){const total=duration*4;frame=(row<2&&$('loop').checked?elapsed%total:Math.min(elapsed,total-1))/duration;frame=Math.min(3,Math.floor(frame));lastFrame=frame}for(const b of $('frames').children)b.classList.toggle('active',Number(b.dataset.frame)===frame);if(image?.complete&&image.naturalWidth){const idle=e.bounds[0],maxw=Math.max(...e.bounds.map(b=>b[2]-b[0])),maxh=Math.max(...e.bounds.map(b=>210-b[1]));const target=['64','96','192'].includes($('size').value)?Number($('size').value):$('size').value==='large'?185:e.star<=3?52:e.star===4||e.id==='species_0148'?64:e.special?82:74;const scale=Math.min(target/(idle[3]-idle[1]),420/maxw,270/maxh);ctx.imageSmoothingEnabled=false;ctx.drawImage(image,frame*281,row*281,281,281,240-140*scale,292-210*scale,281*scale,281*scale)}}requestAnimationFrame(tick)}
async function boot(){try{const [catalog,doc]=await Promise.all([fetch('/api/species').then(r=>r.json()),fetch('/api/reviews').then(r=>r.json())]);species=catalog.species;reviews=doc.reviews||{};const races=[...new Map(species.map(e=>[e.race,e.race_name])).entries()].sort((a,b)=>collator.compare(a[1],b[1]));for(const[id,name]of races)$('race').add(new Option(name,id));selectPet(species.find(e=>e.id===location.hash.slice(1))||species.find(e=>e.id==='species_0037')||species[0]);requestAnimationFrame(tick)}catch(e){$('name').textContent='Không tải được trang review';$('notice').textContent=e.message}}boot();
</script></html>
