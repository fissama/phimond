# Game server (Go). BẮT BUỘC replicas: 1 và strategy Recreate:
# phiên đăng nhập, nhân vật online và giới hạn tốc độ nằm trong bộ nhớ tiến trình.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phimond-server
  namespace: phimond
  labels: { app: phimond-server }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: phimond-server }
  template:
    metadata:
      labels: { app: phimond-server }
    spec:
      imagePullSecrets:
        - name: harbor-pull
      terminationGracePeriodSeconds: 30
      containers:
        - name: phimond-server
          image: harbor.philand.io.vn/philand/phimond-server:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8090, name: http }
          env:
            - { name: GAME_ADDR, value: "0.0.0.0:8090" }
            - { name: GAME_DATA_DIR, value: /data }
            # Domain production (đổi ở đây nếu đổi domain).
            - { name: GAME_ALLOWED_ORIGINS, value: "play.philand.io.vn" }
            - { name: GAME_PUBLIC_URL, value: "https://play.philand.io.vn" }
            # Dải IP của Traefik trong cluster (k3s mặc định 10.42.0.0/16). Xác minh bằng runbook.
            - { name: GAME_TRUSTED_PROXIES, value: "10.42.0.0/16" }
          envFrom:
            # MYSQL_HOST/PORT/USER/PASSWORD/DATABASE/GAME_DB_NAME (và SMTP nếu có), tạo từ SealedSecret.
            - secretRef:
                name: phimond-env
          readinessProbe:
            httpGet: { path: /healthz, port: 8090 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8090 }
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
