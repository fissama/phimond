# VÍ DỤ, KHÔNG áp dụng trực tiếp và KHÔNG commit giá trị thật.
# Tạo Secret thật rồi mã hóa bằng kubeseal (xem docs/DEPLOY-HOMELAB.md), commit bản SealedSecret vào repo infra
# như deploy/identity/sealed-secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: phimond-env
  namespace: phimond
type: Opaque
stringData:
  MYSQL_HOST: "<host-mysql>"
  MYSQL_PORT: "3306"
  MYSQL_USER: "<user-chi-co-quyen-tren-db-phimond>"
  MYSQL_PASSWORD: "<doi-mat-khau>"
  MYSQL_DATABASE: "phimond_reconstruction"   # tên database MỚI riêng của Phimond
  GAME_DB_NAME: "phimond_reconstruction"
  MYSQL_TLS: "false"
  # Tùy chọn (quên mật khẩu qua email):
  # GAME_SMTP_ADDR: ""
  # GAME_SMTP_USER: ""
  # GAME_SMTP_PASS: ""
  # GAME_MAIL_FROM: ""
