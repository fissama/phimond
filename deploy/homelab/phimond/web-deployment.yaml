apiVersion: apps/v1
kind: Deployment
metadata:
  name: phimond-web
  namespace: phimond
  labels: { app: phimond-web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: phimond-web }
  template:
    metadata:
      labels: { app: phimond-web }
    spec:
      imagePullSecrets:
        - name: harbor-pull
      containers:
        - name: phimond-web
          image: harbor.philand.io.vn/philand/phimond-web:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8080, name: http }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
