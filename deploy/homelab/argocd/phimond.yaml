# Áp dụng tay một lần (repo infra không tự triển khai chính nó):
#   ssh philand-01 'sudo k3s kubectl apply -f phimond.yaml'
# So với deploy/argocd/gateway.yaml hiện có để khớp repoURL/project/destination của bạn.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: phimond
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/philandz/infra.git
    targetRevision: main
    path: deploy/phimond
  destination:
    server: https://kubernetes.default.svc
    namespace: phimond
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
