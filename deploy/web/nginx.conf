server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Bản build có băm tên file: cache lâu.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Danh sách asset, i18n, manifest: luôn kiểm tra lại để đổi bản không bị kẹt cache.
  location ~* \.(json)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Ảnh/âm thanh không băm tên: cache vừa phải, kiểm tra lại sau 1 giờ.
  location ~* \.(png|jpg|jpeg|webp|gif|ogg|mp3|wav|woff2?)$ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
