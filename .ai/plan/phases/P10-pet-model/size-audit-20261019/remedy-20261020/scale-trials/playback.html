<!doctype html><meta charset="utf-8"><title>56-species playback audit</title><style>body{background:#17202b;color:#edf3fa;font:14px system-ui;margin:12px}a{color:#9ed2ff}select,button{font:inherit;padding:6px}#grid{display:grid;grid-template-columns:repeat(5,145px);gap:2px}figure{margin:0}canvas{width:145px;height:201px;image-rendering:pixelated}figcaption{font-size:11px;height:30px}#state{margin:8px}</style><p>Playback audit · cùng camera cố định và thước 96px. Chưa runtime / owner approval. <a href="./">So sánh từng loài</a></p><select id="page"></select><select id="row"><option value="0">Idle</option><option value="1">Movement</option><option value="2">Basic</option><option value="3">Skill</option><option value="4">Hurt/down</option></select><button id="play">Play / restart</button><button id="pause">Pause</button><button id="bg">Light/dark</button><p id="state"></p><div id="grid"></div><script>
const page=document.getElementById('page'),row=document.getElementById('row'),grid=document.getElementById('grid'),state=document.getElementById('state');let records=[],views=[],frame=0,running=false,last=0,light=false,cycle=0;for(let i=0;i<7;i++){let o=document.createElement('option');o.value=i;o.textContent='Group '+(i+1);page.append(o)}
function load(){running=false;frame=0;cycle=0;grid.replaceChildren();let set=records.slice(+page.value*8,+page.value*8+8),ref=records.find(r=>r.id==='species_0144');set.splice(4,0,ref);set.push(ref);views=set.map(r=>{let f=document.createElement('figure'),cap=document.createElement('figcaption'),c=document.createElement('canvas'),im=new Image();cap.textContent=r.id+' '+r.name;f.append(cap,c);grid.append(f);im.onload=draw;im.src='images/'+r.id+'.png';return{r,c,im}});draw()}
function draw(){for(let{r,c,im}of views){c.width=145;c.height=201;let x=c.getContext('2d');x.imageSmoothingEnabled=false;x.fillStyle=light?'#dce4ed':'#202936';x.fillRect(0,0,145,201);x.strokeStyle='#708298';x.beginPath();x.moveTo(0,159);x.lineTo(145,159);x.stroke();let k=96/281*r.factor,p=r.pivots_by_row?.[+row.value]||r.pivot;if(im.complete&&im.naturalWidth)x.drawImage(im,frame*281,+row.value*281,281,281,72-p[0]*k,159-p[1]*k,281*k,281*k)}state.textContent='Group '+(+page.value+1)+' / row '+(+row.value+1)+' / frame '+(frame+1)+' / cycles '+cycle+' / '+(running?'playing':(+row.value>1&&frame===3?'hold final':'paused'))}
page.onchange=load;row.onchange=()=>{running=false;frame=0;cycle=0;draw()};document.getElementById('play').onclick=()=>{frame=0;cycle=0;last=performance.now();running=true;draw()};document.getElementById('pause').onclick=()=>{running=false;draw()};document.getElementById('bg').onclick=()=>{light=!light;draw()};function tick(t){if(running&&t-last>=220){last=t;if(frame<3)frame++;else if(+row.value<2){frame=0;cycle++}else running=false;draw()}requestAnimationFrame(tick)}requestAnimationFrame(tick);fetch('proposals.json').then(x=>x.json()).then(d=>{records=d.records;load()});</script>
