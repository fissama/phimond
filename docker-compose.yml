# Phimond dev stack.
#
# Usage:
#   docker compose up --build          # foreground
#   docker compose up -d --build       # background
#   docker compose logs -f server      # tail server logs
#   docker compose down                # stop everything
#
# Open the client at: http://localhost:3000
# Internal flow: browser → ws://localhost:3000/ws (Vite) → ws://localhost:3001 (Node proxy)
#                → TCP localhost:8080 (Godot).
# The Node proxy bridges WebSocket frames to the Godot server's plain TCP socket,
# working around a Chromium handshake incompatibility with Godot's WebSocketServer.

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: phimond-server
    ports:
      - "8080:8080"
    volumes:
      # Persistent player saves — survives container restarts and image rebuilds.
      # Each player is one JSON file at ./data/players/<name>.json.
      - ./data/players:/app/data/players
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  proxy:
    image: node:20-alpine
    container_name: phimond-proxy
    working_dir: /app
    volumes:
      - ./client/ws-proxy.mjs:/app/ws-proxy.mjs:ro
    ports:
      - "3001:3001"
    environment:
      - WS_PORT=3001
      - TCP_HOST=server
      - TCP_PORT=8080
    command: sh -c "npm init -y >/dev/null 2>&1 && npm install ws --silent && node ws-proxy.mjs"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  client:
    image: node:20-alpine
    container_name: phimond-client
    working_dir: /app
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - proxy
    restart: unless-stopped

volumes:
  client_node_modules:
